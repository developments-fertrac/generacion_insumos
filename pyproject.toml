[project]
name = "insumos"
version = "0.1.0"
description = "Generacion de Insumos - pipeline Fertrac (arquitectura hexagonal)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "selenium>=4.15.0",
    "webdriver-manager>=4.0.0",
    "pillow>=10.0.0",
    # <3: el codigo legacy de ventas/envio depende del comportamiento de pandas 2
    # (copy-on-write y dtype de texto cambian en pandas 3). Revisar en Fase 4.
    "pandas>=2.2,<3",
    "numpy>=1.24.0",
    "pandera>=0.20.0",
    "openpyxl>=3.1.0",
    "msoffcrypto-tool>=5.1.0",
    "unidecode>=1.3.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.8.0",
    "PyYAML>=6.0.1",
    "xlrd>=2.0.0",
    "pyxlsb>=1.0.10",
    "PyMuPDF>=1.24.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "import-linter>=2.1.0",
    "datacompy>=0.14.0",
    "types-PyYAML>=6.0.12",
    "types-python-dateutil>=2.9.0",
    "pandas-stubs>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insumos"]

# ======================================================================
# uv
# ======================================================================
[tool.uv]
package = true

# ======================================================================
# ruff
# ======================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".wdm",
    ".wdm_cache",
    "graphify-out",
    "Archivos Validacion",
    "backup",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "C4",   # comprehensions
    "RET",  # return
    "ARG",  # unused arguments
    "PTH",  # pathlib
]
ignore = [
    "E501",    # el largo lo maneja el formatter
    "B008",    # llamadas en defaults (Settings usa default_factory, es intencional)
    "SIM105",  # contextlib.suppress explicito es mas legible aqui
    "RET504",  # el nombre del valor antes del return mejora la lectura
]

[tool.ruff.lint.per-file-ignores]
# El codigo legacy (tasks/, core/, config/, orchestrator, run) se migra tarea por
# tarea en las fases 3-5. En Fase 0 solo se le exige lo que detecta errores
# reales: sintaxis rota, nombres indefinidos, imports muertos.
# Los overrides de abajo se van quitando a medida que cada archivo se migra.
"tasks/*.py" = ["E", "F401", "F841", "F541", "I001", "B", "SIM", "RET", "ARG", "PTH", "UP", "C4"]
"core/*.py" = ["E", "F401", "F841", "F541", "I001", "B", "SIM", "RET", "ARG", "PTH", "UP", "C4"]
"config/*.py" = ["E", "F401", "F841", "F541", "I001", "B", "SIM", "RET", "ARG", "PTH", "UP", "C4"]
"orchestrator.py" = ["E", "F401", "F841", "F541", "I001", "B", "SIM", "RET", "ARG", "PTH", "UP", "C4"]
"run.py" = ["E", "F401", "F841", "F541", "I001", "B", "SIM", "RET", "ARG", "PTH", "UP", "C4"]
"limpiar.py" = ["E", "F401", "F841", "F541", "I001", "B", "SIM", "RET", "ARG", "PTH", "UP", "C4"]
# tests: legibilidad sobre purity
"tests/**" = ["ARG", "SIM", "PTH"]
# Reglas: el contrato es apply(df, ctx) -> RuleResult. Una regla que no necesita
# el contexto lo deja sin usar, y eso no es un error: la firma la fija el
# contrato, no el cuerpo de la regla. Renombrar el parametro a "_ctx" solo para
# callar al linter haria el codigo menos legible.
"src/insumos/domain/rules/**" = ["ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["insumos"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ======================================================================
# mypy
# ======================================================================
[tool.mypy]
python_version = "3.12"
# Fase 0: solo se tipa el codigo nuevo. El legacy (tasks/, core/, config/,
# orchestrator.py, run.py) tiene 129 errores de tipos y se revisa por etapas
# al migrarse en las fases 3-5. Para reincorporarlo: quitar su entrada de
# `exclude` y su override laxo de abajo.
files = ["src", "tests"]
exclude = ['^\.wdm', '^\.wdm_cache', '^graphify-out', '^Archivos Validacion']
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# --- EL DOMINIO SE TIPA ESTRICTO ---
# Sin excepciones: pandas, pandera y stdlib. Cero win32com/selenium/openpyxl.
[[tool.mypy.overrides]]
module = "insumos.domain.*"
disallow_any_explicit = false
disallow_any_expr = false
disallow_any_decorated = true
disallow_subclassing_any = true
disallow_untyped_calls = true
warn_return_any = true
warn_unreachable = true
strict_equality = true

# --- la capa legacy se revisa en modo gradual (Fases 3-5) ---
# No se aplica todavia porque `files` no la incluye, pero queda preparado:
# es lo que se activa archivo por archivo a medida que se migren.
[[tool.mypy.overrides]]
module = [
    "tasks.*",
    "core.*",
    "config.*",
    "orchestrator",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_return_any = false
warn_unreachable = false
check_untyped_defs = false
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "win32com.*",
    "win32clipboard.*",
    "selenium.*",
    "openpyxl.*",
    "msoffcrypto.*",
]
ignore_missing_imports = true

# ======================================================================
# pytest
# ======================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "unit: pruebas rapidas de reglas con DataFrames sinteticos",
    "contract: el adaptador cumple el puerto",
    "golden: equivalencia vieja vs nueva",
    "e2e: smoke test del pipeline completo (requiere Windows + Excel)",
    "slow: mas de 10 segundos",
]
filterwarnings = ["ignore::DeprecationWarning:selenium.*"]

[tool.coverage.run]
source = ["src/insumos", "tests"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
